<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danat App Mini Web</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #222222;
            --accent-color: #2481cc;
        }

        body.dark {
            --bg-color: #18222d;
            --card-bg: #212d3b;
            --text-color: #ffffff;
            --accent-color: #5288c1;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            transition: all 0.3s ease;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h2 {
            margin: 0;
            font-size: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        select, button, input {
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #ccc;
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 14px;
            box-sizing: border-box;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
        }

        .game-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .game-card:active {
            transform: scale(0.98);
        }

        .form-container {
            display: none;
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 13px;
        }

        .form-group select, .form-group input {
            width: 100%;
        }

        .btn-main {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>🎮 Danat App</h2>
        <div class="controls">
            <select id="langSelect" onchange="changeLanguage()">
                <option value="uz">UZB</option>
                <option value="en">ENG</option>
                <option value="ru">RUS</option>
            </select>
            <button onclick="toggleTheme()">🌙/☀️</button>
        </div>
    </div>

    <div class="game-grid" id="gameGrid">
        <div class="game-card" onclick="selectGame('PUBG Mobile')">🎯 PUBG Mobile</div>
        <div class="game-card" onclick="selectGame('Free Fire')">🔥 Free Fire</div>
        <div class="game-card" onclick="selectGame('Standoff 2')">⚡ Standoff 2</div>
        <div class="game-card" onclick="selectGame('Mobile Legends')">🛡 Mobile Legends</div>
        <div class="game-card" onclick="selectGame('Telegram Xizmat
