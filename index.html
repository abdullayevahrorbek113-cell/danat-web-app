<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donat Shop - Web App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Do'kon dizaynini o'zingiz xohlagancha o'zgartirishingiz mumkin */
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --text-color: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }
        .banner {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 20px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .product-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .product-card img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            margin-bottom: 10px;
        }
        .buy-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="banner">
        <h2>🔥 O'yin valyutalari do'koni</h2>
        <p>Tezkor va 100% avtomatik yetkazib berish!</p>
    </div>

    <div class="products-grid" id="product-list">
        <!-- Mahsulotlar dinamik yoki static qo'shiladi -->
        <div class="product-card">
            <img src="https://cdn-icons-png.flaticon.com/512/10860/10860715.png" alt="PUBG">
            <h3>PUBG UC (60 UC)</h3>
            <p>10,000 so'm</p>
            <button class="buy-btn" onclick="buyItem('PUBG 60 UC', 10000)">Sotib olish</button>
        </div>
        <div class="product-card">
            <img src="https://cdn-icons-png.flaticon.com/512/3408/3408506.png" alt="Stars">
            <h3>Telegram Stars (50)</h3>
            <p>15,000 so'm</p>
            <button class="buy-btn" onclick="buyItem('Telegram Stars 50', 15000)">Sotib olish</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // WebApp ni to'liq ochish

        function buyItem(productName, price) {
            // Tanlangan mahsulotni botga yuborish
            const data = { product: productName, price: price };
            tg.sendData(JSON.stringify(data));
            tg.close();
        }
    </script>
</body>
</html>
