<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do'kon va Hisob</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
        h2 { text-align: center; margin-bottom: 5px; }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #f1f1f1);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
        }
        .card.selected { border-color: var(--tg-theme-button-color, #2481cc); }
        .card h3 { margin: 0 0 5px 0; font-size: 16px; }
        .card p { margin: 0; font-size: 14px; color: var(--tg-theme-hint-color, #707579); }
        .btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🛍 Raqamli Mahsulotlar</h2>
        <p style="text-align:center; color:gray; font-size:14px;">Mahsulotni tanlang va avtomatik xarid qiling</p>

        <div id="product-list">
            <div class="card selected" onclick="selectProduct('ebook', this)">
                <h3>📚 Elektron Kitob (PDF)</h3>
                <p>Narxi: 50 Stars</p>
            </div>
            <div class="card" onclick="selectProduct('video', this)">
                <h3>🎬 Premium Video Kurs</h3>
                <p>Narxi: 150 Stars</p>
            </div>
        </div>

        <button class="btn" onclick="checkout()">Sotib olish</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let selectedProduct = 'ebook';

        function selectProduct(productKey, element) {
            document.querySelectorAll('.card').forEach(card => card.classList.remove('selected'));
            element.classList.add('selected');
            selectedProduct = productKey;
        }

        function checkout() {
            let data = JSON.stringify({ "product": selectedProduct });
            tg.sendData(data);
        }
    </script>
</body>
</html>
